[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "world-cup-tracker-demos"
version = "0.1.0"
description = "SoccerNet-based football analytics demos (pass lanes, speed, radar) using Roboflow trackers"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "supervision>=0.25.0",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pandas>=2.0",
]

[project.optional-dependencies]
full = [
    "rfdetr>=1.0.0",
    "torch>=2.2",
    "transformers>=4.40",
    "umap-learn>=0.5",
    "scikit-learn>=1.3",
    "ultralytics>=8.0",
    "gdown>=5.0",
]
dev = ["jupyter>=1.0", "ipykernel>=6.0"]

[project.urls]
Homepage = "https://github.com/roboflow/world-cup-tracker-demos"
Repository = "https://github.com/roboflow/world-cup-tracker-demos"

[tool.setuptools]
package-dir = { "world_cup_projects" = "." }
packages = [
    "world_cup_projects",
    "world_cup_projects.common",
    "world_cup_projects.pass_alternatives",
    "world_cup_projects.player_stats",
]
